<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TubeShield</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --accent: #0a84ff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #f5f5f7; --muted: #98989d; --line: #3a3a3c; } }
    body { margin: 0; width: 280px; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
    header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 15px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    label small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
    h2 { margin: 0; padding: 12px 16px 4px; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    footer { padding: 10px 16px 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>TubeShield</h1>
    <p data-i18n="popupTagline">Ad blocker &amp; YouTube without auto-pause</p>
  </header>
  <label>
    <span><span data-i18n="adblockLabel">Block ads</span><small data-i18n="adblockHint"></small></span>
    <input type="checkbox" id="adblock">
  </label>
  <label>
    <span><span data-i18n="autoUpdateLabel">Update filter lists automatically</span><small id="filterStatus" data-i18n="autoUpdateHint"></small></span>
    <input type="checkbox" id="autoUpdate">
  </label>
  <label>
    <span><span data-i18n="noAutoPauseLabel">Prevent auto-pause</span><small data-i18n="noAutoPauseHint"></small></span>
    <input type="checkbox" id="noAutoPause">
  </label>
  <h2 data-i18n="cleanupHeading">Clean up YouTube</h2>
  <label>
    <span><span data-i18n="hideHomeFeedLabel">Home page without recommendations</span><small data-i18n="hideHomeFeedHint"></small></span>
    <input type="checkbox" id="hideHomeFeed">
  </label>
  <label>
    <span><span data-i18n="hideShortsLabel">Hide Shorts</span><small data-i18n="hideShortsHint"></small></span>
    <input type="checkbox" id="hideShorts">
  </label>
  <footer id="status" data-i18n="statusDefault">Changes apply immediately.</footer>
  <script src="popup.js"></script>
</body>
</html>
